<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мир шаров — Чёрная пятница</title>
<style>
:root{--bg:#02040d;--blue:#1e6fd9;--glow:#2f8bff;--txt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#0b1f4a 0,var(--bg) 60%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:20px 14px 40px}
.logo{width:min(320px,70%);display:block;margin:0 auto}
h1{margin:0;font-size:clamp(30px,8vw,56px);letter-spacing:1px;text-transform:uppercase;font-weight:900}
h1 b{color:var(--glow);text-shadow:0 0 24px #1e6fd9}
.tag{display:inline-block;border:2px solid #fff3;border-radius:10px;padding:2px 14px;margin:6px 0;font-weight:800}
.sub{letter-spacing:4px;font-size:14px;opacity:.85;margin:6px 0 20px}
.box{max-width:380px;margin:0 auto;background:#ffffff0d;border:1px solid #2f8bff66;border-radius:18px;padding:20px;box-shadow:0 0 30px #1e6fd933}
input{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #2f8bff88;background:#000a;color:#fff;font-size:17px}
label{display:flex;gap:8px;text-align:left;font-size:12px;opacity:.8;margin:8px 0}
label input{width:auto;margin:2px 0}
button.main{width:100%;padding:15px;margin-top:8px;border:0;border-radius:12px;background:linear-gradient(135deg,#2f8bff,#1450b0);color:#fff;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 0 20px #2f8bff88}
button:disabled{opacity:.5}
.err{color:#ff7b7b;min-height:20px;font-size:14px;margin-top:6px}
#game,#done{display:none}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:900px;margin:0 auto}
.card{width:calc(33.3% - 8px);max-width:200px;aspect-ratio:1;perspective:700px;cursor:pointer;position:relative}
@media(min-width:700px){.card{width:calc(25% - 10px)}}
.in{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;overflow:hidden}
.f img{width:100%;height:100%;display:block;object-fit:cover}
.n{position:absolute;top:4%;left:0;right:0;font-size:clamp(16px,4vw,24px);font-weight:600;text-shadow:0 0 6px #000}
.b{transform:rotateY(180deg);background:radial-gradient(circle,#123a80,#030a1c);border:2px solid var(--glow);display:flex;align-items:center;justify-content:center;padding:8px;font-weight:900;font-size:clamp(14px,3.6vw,20px);box-shadow:0 0 30px var(--glow)}
.card:not(.flip):hover .in{transform:translateY(-4px) scale(1.03)}
.card.dim{opacity:.35;pointer-events:none}
.prize{font-size:30px;font-weight:900;color:var(--glow);margin:10px 0;text-shadow:0 0 20px #1e6fd9}
.who{background:#000a;border:1px solid #2f8bff66;border-radius:12px;padding:10px;margin:8px 0;font-size:18px;line-height:1.5}.who b{font-size:20px}
.hint{opacity:.8;font-size:14px;margin:0 0 14px}
#intro{position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .9s}
#intro.hide{opacity:0;pointer-events:none}
#intro video{width:min(92vw,92vh,640px);height:auto;display:block}
#skip{position:absolute;bottom:22px;right:18px;background:none;border:1px solid #fff4;color:#fff9;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
body>:not(#intro){animation:rise 1s .2s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>

const DEMO = [["-5%",18],["-7%",15],["-10%",11],["-11%",8],["-15%",5],["Доп. шар к заказу",12],["50% на один фольгированный шар",6],["Плюшевый мишка 🧸",1],["Скидка 100 ₽",14],["Скидка 300 ₽",7],["Скидка 500 ₽",3]];
const $ = id => document.getElementById(id);
let phone = "", name = "", busy = false;

function normPhone(v){
  let d = v.replace(/\D/g, "");
  if (d.length === 11 && (d[0] === "7" || d[0] === "8")) d = d.slice(1);
  return d.length === 10 ? "7" + d : "";
}
async function api(payload){
  if (API_URL){
    const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
    return r.json();
  }
  // демо-режим: хранение в браузере
  let db = {}; try { db = JSON.parse(localStorage.getItem("demo")||"{}"); } catch(e){}
  const p = payload.phone;
  if (db[p]) return {ok:true, played:true, prize:db[p]};
  if (payload.action === "check") return {ok:true, played:false};
  let t = Math.random()*100, prize = DEMO[0][0];
  for (const [n,w] of DEMO){ if ((t -= w) < 0){ prize = n; break; } }
  db[p] = prize; try { localStorage.setItem("demo", JSON.stringify(db)); } catch(e){}
  return {ok:true, played:false, prize};
}
function showDone(prize, again){
  $("start").style.display = $("game").style.display = "none";
  $("done").style.display = "block";
  $("doneTxt").textContent = again ? "Вы уже участвовали. Ваш приз:" : "🎉 Поздравляем! Ваш приз:";
  $("prize").textContent = prize;
  const p = phone;
  $("who").innerHTML = "<b></b><br><span></span>";
  $("who").firstChild.textContent = name;
  $("who").lastChild.textContent = "+7 (" + p.slice(1,4) + ") " + p.slice(4,7) + "-" + p.slice(7,9) + "-" + p.slice(9);
}
$("go").onclick = async () => {
  $("err").textContent = "";
  phone = normPhone($("phone").value); name = $("name").value.trim();
  if (!name) return $("err").textContent = "Введите имя";
  if (!phone) return $("err").textContent = "Введите корректный номер телефона";
  if (!$("ok").checked) return $("err").textContent = "Нужно согласие на обработку номера";
  $("go").disabled = true;
  try {
    const r = await api({action:"check", phone, name});
    if (!r.ok) throw 0;
    if (r.played) return showDone(r.prize, true);
    $("start").style.display = "none"; $("game").style.display = "block";
  } catch(e){ $("err").textContent = "Ошибка связи, попробуйте ещё раз"; }
  $("go").disabled = false;
};
const grid = $("grid");
for (let i = 1; i <= 11; i++){
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<div class="in"><div class="f"><img src="${CARD}" alt=""><div class="n">${String(i).padStart(2,"0")}</div></div><div class="b"></div></div>`;
  c.onclick = () => pick(c, i);
  grid.appendChild(c);
}
async function pick(c, i){
  if (busy) return; busy = true;
  document.querySelectorAll(".card").forEach(x => x !== c && x.classList.add("dim"));
  try {
    const r = await api({action:"play", phone, name, card:i});
    if (!r.ok) throw 0;
    c.querySelector(".b").textContent = r.prize;
    c.classList.add("flip");
    setTimeout(() => showDone(r.prize, r.played), 2200);
  } catch(e){
    busy = false; document.querySelectorAll(".card").forEach(x => x.classList.remove("dim"));
    alert("Ошибка связи, попробуйте ещё раз");
  }
}
</script>
